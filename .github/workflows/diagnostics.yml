name: Diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'crates/converter/src/diagnostics/**'
      - 'crates/converter/src/analysis.rs'
      - 'crates/converter/src/signal_processing/**'
      - 'crates/converter/tests/fixtures/**'
      - 'crates/converter/benches/**'
      - 'scripts/ci/check-analyzer.sh'
      - '.github/workflows/diagnostics.yml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/converter/src/diagnostics/**'
      - 'crates/converter/src/analysis.rs'
      - 'crates/converter/src/signal_processing/**'
      - 'crates/converter/tests/fixtures/**'
      - 'crates/converter/benches/**'
      - 'scripts/ci/check-analyzer.sh'
      - '.github/workflows/diagnostics.yml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  INSTA_UPDATE: "no"

jobs:
  validate:
    name: Validate analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check analyzer requirements
        run: scripts/ci/check-analyzer.sh

  test:
    name: Diagnostic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true  # fixtures are stored via Git LFS

      - run: rustup show  # installs version from rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Run converter analysis and diagnostic tests
        run: cargo test -p flight-review --lib -- --nocapture

      - name: Healthy and negative regression controls
        run: |
          cargo test -p flight-review --lib no_false_positives -- --nocapture

      - name: Real-world fixture tests
        run: |
          cargo test -p flight-review --lib detects_real -- --nocapture

      - name: Snapshot tests up to date
        run: |
          cargo test -p flight-review --lib snapshot 2>&1 || {
            echo "Snapshot tests failed. Run 'cargo insta review' locally."
            exit 1
          }

  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true  # fixtures are stored via Git LFS

      - run: rustup show  # installs version from rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ hashFiles('crates/converter/src/**', 'crates/converter/benches/**') }}
          restore-keys: |
            criterion-${{ runner.os }}-

      - name: Run conversion benchmark
        run: |
          set -o pipefail
          cargo bench -p flight-review --bench convert 2>&1 | tee bench-output.txt

      - name: Check performance budget
        run: scripts/ci/check-bench-budget.sh bench-output.txt
