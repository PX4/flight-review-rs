[package]
name = "flight-review"
version = "0.1.0"
edition = "2021"
default-run = "flight-review"
description = "Understand flight performance and investigate issues in PX4 flight logs"
license = "MIT"
repository = "https://github.com/PX4/flight-review-rs"
keywords = ["px4", "ulog", "parquet", "flight-review", "drone"]
categories = ["science", "command-line-utilities", "parser-implementations"]

[dependencies]
px4-ulog = "0.6.1"
arrow = "54"
parquet = { version = "54", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustfft = "6"
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"

[[bin]]
name = "flight-review"
path = "src/bin/flight_review.rs"

[[bench]]
name = "convert"
harness = false

[build-dependencies]
toml = "0.8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }
insta = { version = "1", features = ["json"] }
